- name: Find enterprise repos
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/{{ item }}.sources"
  loop: [pve-enterprise, ceph]
  register: enterprise

- name: Disable enterprise repos
  ansible.builtin.lineinfile:
    path: "{{ item.stat.path }}"
    regexp: "^Enabled:"
    line: "Enabled: no"
  loop: "{{ enterprise.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: No-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  when: upgrade | default(false) | bool

- name: Packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    update_cache: true
    cache_valid_time: 3600

- name: Timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Refresh container template index
  ansible.builtin.command: pveam update
  changed_when: false

- name: Newest Debian template
  ansible.builtin.shell: >
    set -o pipefail;
    pveam available --section system
    | awk '$2 ~ /^{{ ct_template }}_.*_amd64/ {print $2}' | sort -V | tail -1
  args:
    executable: /bin/bash
  register: template
  changed_when: false

- name: Downloaded templates
  ansible.builtin.command: pveam list {{ ct_storage }}
  register: templates
  changed_when: false

- name: Download it
  ansible.builtin.command: pveam download {{ ct_storage }} {{ template.stdout }}
  when: template.stdout not in templates.stdout
