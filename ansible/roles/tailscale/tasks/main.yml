- name: Tailscale key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Tailscale repo
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true

- name: tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: No MagicDNS on the host
  ansible.builtin.command: tailscale set --accept-dns=false
  changed_when: false

- name: IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: UDP GRO forwarding
  ansible.builtin.systemd:
    name: tailscale-udp-gro
    enabled: true
    state: started
    daemon_reload: true

- name: Serve status
  ansible.builtin.command: tailscale serve status --json
  register: serve
  changed_when: false
  check_mode: false

- name: Serve wanted
  ansible.builtin.set_fact:
    serve_wanted: >-
      {% set out = [] %}{% for s in tailscale_serve %}{% set _ = out.append(s.port ~ ' ' ~ s.scheme | default('http') ~ '://' ~ hostvars[s.guest].ansible_host ~ ':' ~ s.to | default(s.port) ~ ' ' ~ ('funnel' if s.funnel | default(false) else 'http')) %}{% endfor %}{{ out | sort }}
    serve_current: >-
      {% set out = [] %}{% set st = serve.stdout | from_json %}{% for k, v in (st.Web | default({})).items() %}{% set _ = out.append(k.split(':')[-1] ~ ' ' ~ v.Handlers['/'].Proxy ~ ' ' ~ ('funnel' if (st.AllowFunnel | default({}))[k] | default(false) else 'http')) %}{% endfor %}{{ out | sort }}

- name: Serve reset
  ansible.builtin.command: tailscale serve reset
  when: serve_wanted != serve_current

- name: Serve guests
  ansible.builtin.command: >-
    {{ 'tailscale funnel --bg --https=' if item.split(' ')[2] == 'funnel' else 'tailscale serve --bg --http=' }}{{ item.split(' ')[0] }} {{ item.split(' ')[1] }}
  loop: "{{ serve_wanted }}"
  when: serve_wanted != serve_current
