x-arr: &arr
  restart: unless-stopped
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: America/Santiago
  volumes:
    - /srv/media:/data

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "1000:1000"
    ports: ["8096:8096"]
    environment:
      TZ: America/Santiago
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - /srv/media:/data

  sonarr:
    <<: *arr
    image: lscr.io/linuxserver/sonarr:latest
    ports: ["8989:8989"]
    volumes:
      - ./config/sonarr:/config
      - /srv/media:/data

  radarr:
    <<: *arr
    image: lscr.io/linuxserver/radarr:latest
    ports: ["7878:7878"]
    volumes:
      - ./config/radarr:/config
      - /srv/media:/data

  lidarr:
    <<: *arr
    image: lscr.io/linuxserver/lidarr:latest
    ports: ["8686:8686"]
    volumes:
      - ./config/lidarr:/config
      - /srv/media:/data

  prowlarr:
    <<: *arr
    image: lscr.io/linuxserver/prowlarr:latest
    ports: ["9696:9696"]
    volumes:
      - ./config/prowlarr:/config

  bazarr:
    <<: *arr
    image: lscr.io/linuxserver/bazarr:latest
    ports: ["6767:6767"]
    volumes:
      - ./config/bazarr:/config
      - /srv/media:/data

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports: ["8080:8080"]
    env_file: vpn.env
    environment:
      TZ: America/Santiago

  qbittorrent:
    <<: *arr
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Santiago
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./config/qbittorrent:/config
      - /srv/media:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: America/Santiago

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.1.140:3000,media:3000,media.lan:3000,sarten:3000
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/media:/data:ro
