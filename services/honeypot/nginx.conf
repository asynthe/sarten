server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    set_real_ip_from 192.168.1.135;
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/access.log combined;
    root /usr/share/nginx/html;

    location = /login {
        return 401;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
