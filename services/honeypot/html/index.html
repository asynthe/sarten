<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Console</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e2329; font: 14px system-ui, sans-serif; color: #d5d9de; }
  form { width: 280px; padding: 28px; background: #2a3038; border-radius: 6px; }
  h1 { margin: 0 0 20px; font-size: 18px; font-weight: 600; }
  label { display: block; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #444c56; border-radius: 4px; background: #1e2329; color: inherit; }
  button { width: 100%; margin-top: 20px; padding: 9px; border: 0; border-radius: 4px; background: #3d7be0; color: #fff; font-weight: 600; }
  p { margin: 16px 0 0; font-size: 12px; color: #8b949e; text-align: center; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Admin Console</h1>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username">
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
  <p>Authorized personnel only.</p>
</form>
</body>
</html>
