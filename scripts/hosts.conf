# sarten homelab — host/service inventory (non-secret; plain IPs/ports only).
# Sourced by monitor.sh. Secrets (passwords, API keys, VPN keys) stay in
# ansible/group_vars/all.sops.yaml — never put them in this file.
#
# SSH access: p1 and macbook pubkeys are authorized on sarten + all guests
# as both 'asynthe' and 'root' (see ansible/inventory.yml, ansible_user: root).
# Proxmox host is reached via the 'sarten' entry in ~/.ssh/config.

PROXMOX_HOST="sarten"          # ssh alias, see ~/.ssh/config (192.168.1.135)
PROXMOX_WEBUI="https://192.168.1.135:8006"

# guest containers: ct_id, hostname, ip, "svc1:port1,svc2:port2,..."
# (services list is used for external HTTP health checks; leave empty for none)
GUESTS=(
  "110|media|192.168.1.140|Jellyfin:8096,Sonarr:8989,Radarr:7878,Prowlarr:9696,Bazarr:6767,qBittorrent:8080,Homepage:3000"
  "120|monitoring|192.168.1.141|Grafana:3000,Prometheus:9090"
  "130|wazuh|192.168.1.142|Dashboard:443"
  "140|honeypot|192.168.1.143|Decoy:80"
  "150|hermes|192.168.1.143|Dashboard:9119"
)
# NOTE: honeypot (140) and hermes (150) are BOTH statically configured to
# 192.168.1.143 (confirmed via `pct config <id> | grep net`) — a real IP
# conflict in the Proxmox guest config, not a typo here. hermes' ct also has
# no docker containers and no hermes systemd unit/process running (as of
# 2026-10-18), so it looks unprovisioned. Fix the IP clash before relying on
# the hermes guest for anything.

# wazuh dashboard is HTTPS with a self-signed cert
WAZUH_HTTPS_CTS="130"
